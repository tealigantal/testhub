name: Build Hupu Game APK

on:
  push:
    branches:
      - chatgpt-hupu-apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android-hupu-wrapper assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hupu-game-apk
          path: android-hupu-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-hupu-wrapper/app/build/outputs/apk/debug/app-debug.apk Hupu-Basketball-Original.apk
          gh release delete hupu-game-v1 --yes --cleanup-tag || true
          gh release create hupu-game-v1 Hupu-Basketball-Original.apk \
            --target "$GITHUB_SHA" \
            --title "Hupu Basketball Android v1" \
            --notes "Android wrapper for the original Hupu activity-project-ai-1784970502666 game page. Requires internet access."
