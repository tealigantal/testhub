name: Build Perfect Player APK

on:
  push:
    branches:
      - chatgpt-hupu-apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Perfect Player assets
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
          ASSETS='android-perfect-player/app/src/main/assets'
          rm -rf "$ASSETS" && mkdir -p "$ASSETS/assets"
          curl -L --fail --retry 3 -A "$UA" 'https://activity-static.hupu.com/colorbox-activities/activity-project-ai-1783761934042/__ai_app.html' -o /tmp/perfect.html
          urls=(
          'https://activity-static.hoopchina.com.cn/files/2678-58zyeprc-upload-1783508428855-12.js'
          'https://activity-static.hoopchina.com.cn/files/2678-5hu3djrc-upload-1783494754597-12.js'
          'https://activity-static.hoopchina.com.cn/files/2678-gd4jvxrc-upload-1783494754597-15.js'
          'https://activity-static.hoopchina.com.cn/files/2678-456sfprc-upload-1783494754597-18.js'
          'https://activity-static.hoopchina.com.cn/files/2678-mdo4zerc-upload-1783494754597-21.js'
          'https://activity-static.hoopchina.com.cn/files/2678-qlg35lrc-upload-1783494754597-24.js'
          'https://activity-static.hoopchina.com.cn/files/26630-uq56cnrc-upload-1782786826635-12.js'
          'https://activity-static.hoopchina.com.cn/files/26716-pz0d55rc-upload-1784184998973-30.js'
          )
          for i in ${!urls[@]}; do n=$((i+1)); curl -L --fail --retry 3 -A "$UA" "${urls[$i]}" -o "$ASSETS/assets/data-$n.js"; done
          python3 tools/patch_perfect_player_apk.py /tmp/perfect.html "$ASSETS"
          grep -q '更换球员 · 免费∞' "$ASSETS/index.html"
          grep -q '30队免费任选' "$ASSETS/index.html"
          grep -q "applicationId 'com.tealigantal.perfectplayer'" android-perfect-player/app/build.gradle
          grep -q 'file:///android_asset/index.html' android-perfect-player/app/src/main/java/com/tealigantal/perfectplayer/MainActivity.java
      - name: Build APK
        run: gradle -p android-perfect-player assembleDebug --stacktrace
      - name: Prepare release
        run: |
          cp android-perfect-player/app/build/outputs/apk/debug/app-debug.apk Perfect-Player-Free.apk
          sha256sum Perfect-Player-Free.apk
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-player-free-apk
          path: Perfect-Player-Free.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete perfect-player-free-v1 --yes --cleanup-tag || true
          gh release create perfect-player-free-v1 Perfect-Player-Free.apk --target "$GITHUB_SHA" --title "我创造的完美球员 · 独立版 v1" --notes "独立 Android APK；包名 com.tealigantal.perfectplayer，可与挑战传奇同时安装；换球员永久免费无限；生涯球队30队免费任选。"
