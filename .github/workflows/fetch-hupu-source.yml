name: Fetch Hupu H5 Source

on:
  push:
    branches:
      - chatgpt-hupu-apk
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact H5 pages
        run: |
          mkdir -p out
          curl -L --fail --retry 3 \
            -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36' \
            'https://activity-static.hupu.com/colorbox-activities/activity-project-ai-1784970502666/__ai_app.html' \
            -o out/__ai_app.html
          curl -L --fail --retry 3 \
            -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36' \
            'https://activity-static.hupu.com/colorbox-activities/activity-project-ai-1784970502666/index.html?t=1786677845569&night=0' \
            -o out/index.html
          echo '--- sizes ---'
          wc -c out/*
          echo '--- title / keywords ---'
          grep -Eio '<title>[^<]+|重抽|刷新|广告|OVR|传奇模式|现役模式|征服联盟|打造我的传奇球星' out/__ai_app.html | head -100 || true
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: exact-hupu-h5-source
          path: out
          if-no-files-found: error
