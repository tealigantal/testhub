name: Inspect Perfect Player Legend

on:
  push:
    branches:
      - chatgpt-hupu-apk
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfect-player-legend-inspect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Mark inspection running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE='debug/perfect-legend-status.txt'
          BODY=$(printf 'status=running\nrun_id=%s\nsource_commit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA")
          B64=$(printf '%s' "$BODY" | base64 -w0)
          OLD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$GITHUB_REF_NAME" --jq '.sha' 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message='[skip ci] Mark legend inspection running' -f content="$B64" -f sha="$OLD_SHA" -f branch="$GITHUB_REF_NAME" >/dev/null
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message='[skip ci] Mark legend inspection running' -f content="$B64" -f branch="$GITHUB_REF_NAME" >/dev/null
          fi
      - name: Fetch and inspect latest H5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
          curl -L --fail --retry 3 -A "$UA" 'https://activity-static.hupu.com/colorbox-activities/activity-project-ai-1783761934042/__ai_app.html' -o /tmp/perfect.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/perfect.html').read_text(encoding='utf-8',errors='replace')
          lines=s.splitlines()
          out=['SIZE='+str(len(s)), 'LINES='+str(len(lines))]
          # compact relevant lines
          keys=('传奇模式','legend','LEGEND','STATE.mode','NBA2K_','_DATA','_TEAMS','currentData','legendData','playerPool','PLAYER_POOL')
          hits=[]
          for i,line in enumerate(lines,1):
            if any(k in line for k in keys):
              hits.append(f'{i}: '+line[:900])
              if len(hits)>=500: break
          out.append('\n--- RELEVANT LINES ---\n'+'\n'.join(hits))
          # exact core function snippets
          for name in ['renderModeSelect','startGame','renderPositionSelect','startBuild','spinTeam','renderRosterPlayers','rerollTeamPlayers','pickPlayer','getPlayerMainPos','getPosPenalty','calcOVR']:
            idx=s.find('function '+name)
            if idx>=0: out.append('\n--- FUNCTION '+name+' ---\n'+s[idx:idx+4500])
          # external js URLs
          urls=sorted(set(re.findall(r'https://[^\"\'<> ]+?\.js(?:\?[^\"\'<> ]*)?',s)))
          out.append('\n--- JS URLS ---\n'+'\n'.join(urls))
          text='\n'.join(out)
          Path('/tmp/inspect.txt').write_text(text[:180000],encoding='utf-8')
          PY
          FILE='debug/perfect-legend-inspect.txt'
          BODY=$(base64 -w0 /tmp/inspect.txt)
          OLD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$GITHUB_REF_NAME" --jq '.sha' 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message='[skip ci] Inspect latest Perfect Player legend mode' -f content="$BODY" -f sha="$OLD_SHA" -f branch="$GITHUB_REF_NAME" >/dev/null
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message='[skip ci] Inspect latest Perfect Player legend mode' -f content="$BODY" -f branch="$GITHUB_REF_NAME" >/dev/null
          fi
          STATUS=$(printf 'status=success\nrun_id=%s\nsource_commit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" | base64 -w0)
          SFILE='debug/perfect-legend-status.txt'
          SSHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$SFILE?ref=$GITHUB_REF_NAME" --jq '.sha')
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$SFILE" -f message='[skip ci] Mark legend inspection success' -f content="$STATUS" -f sha="$SSHA" -f branch="$GITHUB_REF_NAME" >/dev/null
